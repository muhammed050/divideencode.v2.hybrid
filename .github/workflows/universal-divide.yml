name: Universal Divide

on:
  push:
    branches:
      - experiment/universal-divide
  pull_request:
    branches:
      - experiment/universal-divide

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run tests
        run: |
          python -m pytest -q tests/test_universal_divide.py
